<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منابع عمران فسا</title>
    
    <!-- 1. اسکریپت رسمی Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 2. فونت وزیرمتن از گوگل فونت -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ff9800; /* رنگ نارنجی مهندسی */
            --primary-hover: #f57c00;
            --bg-dark: #121212;
            --text-light: #f5f5f5;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            /* الگوی هندسی ظریف برای حس عمرانی + گرادیانت دارک */
            background-image: 
                linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)),
                repeating-linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222),
                repeating-linear-gradient(45deg, #222 25%, #121212 25%, #121212 75%, #222 75%, #222);
            background-position: 0 0, 0 0, 10px 10px;
            background-size: 100% 100%, 20px 20px, 20px 20px;
            
            color: var(--text-light);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* یک خط تزئینی زیر تیتر */
        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--primary-color);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            margin-bottom: 16px;
            background-color: rgba(255, 152, 0, 0.1);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* افکت شیشه‌ای */
        }

        .menu-btn:active {
            background-color: var(--primary-color);
            color: #121212;
            transform: scale(0.96);
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
        }
    </style>
</head>
<body>
    <h2>🏗️ منابع عمران فسا</h2>

    <!-- دکمه هدایت به تاپیک -->
    <button class="menu-btn" onclick="openTopic('https://t.me/CivilFasa_resources/2')">
        📖 ورود به تاپیک منابع
    </button>

    <script>
        // مقداردهی اولیه به Telegram WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); // باز کردن در حالت تمام صفحه

        // تغییر رنگ هدر تلگرام به رنگ دارک (اختیاری)
        Telegram.WebApp.setHeaderColor('#121212');

        // تابع پرش به تاپیک با استفاده از openTelegramLink
        function openTopic(url) {
            Telegram.WebApp.openTelegramLink(url);
        }
    </script>
</body>
</html>
