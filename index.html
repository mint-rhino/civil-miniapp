<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منابع عمران فسا</title>
    
    <!-- SDK تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #121315;
            --surface-card: #1c1df1c;
            --accent-yellow: #ffb703;
            --accent-muted: rgba(255, 183, 3, 0.12);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --radius-main: 12px;
            --radius-sub: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            /* پس‌زمینه شبکه مهندسی (Blueprint Grid) */
            background-image: 
                radial-gradient(rgba(255, 183, 3, 0.05) 1px, transparent 0),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px, 12px 12px, 12px 12px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ─── هدر ─── */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--accent-yellow);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 400;
        }

        /* ─── کامپوننت اکاردئون و دکمه‌ها ─── */
        .accordion-group {
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-main);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: rgba(28, 29, 33, 0.6);
            backdrop-filter: blur(12px);
            transition: border-color 0.25s ease;
        }

        .accordion-group:focus-within,
        .accordion-group:has(.btn-trigger.active) {
            border-color: rgba(255, 183, 3, 0.4);
        }

        .btn-trigger {
            width: 100%;
            padding: 16px 18px;
            background: transparent;
            color: var(--text-main);
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease;
        }

        .btn-trigger:active {
            background: var(--accent-muted);
        }

        .btn-trigger .btn-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-trigger .icon {
            font-size: 16px;
        }

        .btn-trigger .chevron {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-sub);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease;
        }

        .btn-trigger.active .chevron {
            transform: rotate(180deg);
            stroke: var(--accent-yellow);
        }

        /* ─── محتوای زیرمنو ─── */
        .submenu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(18, 19, 21, 0.5);
        }

        .submenu-inner {
            padding: 10px 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ─── دکمه‌های آیتم‌ها ─── */
        .item-btn {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sub);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .item-btn:active {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            font-weight: 700;
            transform: scale(0.98);
        }

        .item-btn .link-arrow {
            font-size: 12px;
            opacity: 0.5;
        }

        .item-btn:active .link-arrow {
            opacity: 1;
        }

        /* ─── دکمه تکی ─── */
        .single-btn {
            border-radius: var(--radius-main);
            border: 1px solid var(--border-color);
            background: rgba(28, 29, 33, 0.6);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر -->
        <header>
            <div class="brand-title">
                <span>🏗️</span> منابع عمران فسا
            </div>
            <div class="brand-subtitle">پورتال دسترسی سریع به گروه‌ها و سامانه‌ها</div>
        </header>

        <!-- بخش ۱: منابع درسی -->
        <div class="accordion-group">
            <button class="btn-trigger" onclick="toggleAccordion(this, 'menu-study')">
                <div class="btn-title">
                    <span class="icon">📚</span>
                    <span>منابع درسی</span>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="menu-study" class="submenu-content">
                <div class="submenu-inner">
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/2')">
                        <span>فیزیک / استاتیک / دینامیک</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/295')">
                        <span>📋 نظام مهندسی</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/498')">
                        <span>🏗️ مقاومت مصالح</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/93')">
                        <span>🛠️ دروس عملی و کارآموزی</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/3')">
                        <span>📐 ریاضی / آمار / دیفرانسیل</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/6')">
                        <span>📏 نقشه‌کشی / معماری / نقشه‌برداری</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/80')">
                        <span>🪨 زمین‌شناسی / مصالح / بتن</span>
                        <span class="link-arrow">←</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- بخش ۲: سامانه‌ها -->
        <div class="accordion-group">
            <button class="btn-trigger" onclick="toggleAccordion(this, 'menu-systems')">
                <div class="btn-title">
                    <span class="icon">🌐</span>
                    <span>سامانه‌های دانشگاه</span>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="menu-systems" class="submenu-content">
                <div class="submenu-inner">
                    <button class="item-btn" onclick="openExternal('https://food.fasau.ac.ir/')">
                        <span>🍽️ کالینان (سامانه غذا)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('https://pershiess.fasau.ac.ir/')">
                        <span>📖 آموزش (پرشیس)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('http://online.fasau.ac.ir/')">
                        <span>💻 مودل (امتحانات)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('https://ja-ostadi.ir/')">
                        <span>👨‍🏫 جا استادی</span>
                        <span class="link-arrow">↗</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- بخش ۳: نرم‌افزارها -->
        <div class="accordion-group single-btn">
            <button class="btn-trigger" onclick="openTopic('')">
                <div class="btn-title">
                    <span class="icon">💻</span>
                    <span>نرم‌افزارها</span>
                </div>
                <span class="link-arrow" style="color: var(--text-sub);">←</span>
            </button>
        </div>
    </div>

    <script>
        // مقداردهی اولیه وب‌اپ تلگرام
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#121315');
            tg.setBackgroundColor('#121315');
        }

        // ویبره هپتیک فیدبک برای حس بهتر در تلگرام
        function triggerHaptic() {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function openTopic(url) {
            triggerHaptic();
            if (tg?.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function openExternal(url) {
            triggerHaptic();
            if (tg?.openLink) {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function toggleAccordion(btn, menuId) {
            triggerHaptic();
            const targetMenu = document.getElementById(menuId);
            const isOpen = btn.classList.contains('active');

            // بستن تمام کشوهای دیگر (حالت آکاردئونی یکپارچه)
            document.querySelectorAll('.btn-trigger.active').forEach(activeBtn => {
                activeBtn.classList.remove('active');
            });
            document.querySelectorAll('.submenu-content').forEach(menu => {
                menu.style.maxHeight = null;
            });

            // اگر منوی فعلی بسته بود، آن را باز کن
            if (!isOpen) {
                btn.classList.add('active');
                targetMenu.style.maxHeight = targetMenu.scrollHeight + "px";
            }
        }
    </script>
</body>
</html>
