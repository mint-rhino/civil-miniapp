<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>منابع عمران فسا</title>
    <meta name="theme-color" content="#121315">

    <!-- اتصال سریع به فونت‌ها -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- SDK تلگرام (غیرمسدودکننده) -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

    <!-- استایل اصلی -->
    <link rel="stylesheet" href="style.css">

    <!-- اسکریپت اصلی -->
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <!-- هدر -->
        <header>
            <h1 class="brand-title">
                <span aria-hidden="true">🏗️</span>
                <span>منابع عمران فسا</span>
            </h1>
            <p class="brand-subtitle">پورتال دسترسی سریع به گروه‌ها و سامانه‌ها</p>
        </header>

        <!-- بخش ۱: منابع درسی -->
        <section class="accordion-group">
            <button type="button" class="btn-trigger" aria-expanded="false" aria-controls="menu-study" onclick="toggleAccordion(this, 'menu-study')">
                <span class="btn-title">
                    <span class="icon" aria-hidden="true">📚</span>
                    <span>منابع درسی</span>
                </span>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div id="menu-study" class="submenu-content">
                <div class="submenu-inner">
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/2')">
                        <span>🧑‍🔬 فیزیک / استاتیک / دینامیک</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/295')">
                        <span>📋 نظام مهندسی</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/498')">
                        <span>🏗️ مقاومت مصالح</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/93')">
                        <span>🛠️ دروس عملی و کارآموزی</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/3')">
                        <span>📐 ریاضی / آمار / دیفرانسیل</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/6')">
                        <span>📏 نقشه‌کشی / معماری / نقشه‌برداری</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/80')">
                        <span>🪨 زمین‌شناسی / مصالح / بتن</span>
                        <span class="link-arrow" aria-hidden="true">←</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- بخش ۲: سامانه‌ها -->
        <section class="accordion-group">
            <button type="button" class="btn-trigger" aria-expanded="false" aria-controls="menu-systems" onclick="toggleAccordion(this, 'menu-systems')">
                <span class="btn-title">
                    <span class="icon" aria-hidden="true">🌐</span>
                    <span>سامانه‌های دانشگاه</span>
                </span>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div id="menu-systems" class="submenu-content">
                <div class="submenu-inner">
                    <button type="button" class="item-btn" onclick="openExternal('https://food.fasau.ac.ir/')">
                        <span>🍽️ کالینان (سامانه غذا)</span>
                        <span class="link-arrow" aria-hidden="true">↗</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openExternal('https://pershiess.fasau.ac.ir/')">
                        <span>📖 اتوماسیون (آموزش)</span>
                        <span class="link-arrow" aria-hidden="true">↗</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openExternal('http://online.fasau.ac.ir/')">
                        <span>💻 مودل (امتحانات)</span>
                        <span class="link-arrow" aria-hidden="true">↗</span>
                    </button>
                    <button type="button" class="item-btn" onclick="openExternal('https://ja-ostadi.ir/')">
                        <span>👨‍🏫 جا استادی</span>
                        <span class="link-arrow" aria-hidden="true">↗</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- بخش ۳: نرم‌افزارها -->
        <div class="accordion-group single-btn">
            <button type="button" class="btn-trigger" onclick="navigateTo('software.html')">
                <span class="btn-title">
                    <span class="icon" aria-hidden="true">💻</span>
                    <span>نرم‌افزارها</span>
                </span>
                <span class="link-arrow" aria-hidden="true">←</span>
            </button>
        </div>

        <!-- بخش ۴: چارت دروس -->
        <div class="accordion-group single-btn">
            <button type="button" class="btn-trigger" onclick="openChart()">
                <span class="btn-title">
                    <span class="icon" aria-hidden="true">📊</span>
                    <span>چارت دروس عمران</span>
                </span>
                <span class="link-arrow" aria-hidden="true">←</span>
            </button>
        </div>

        <!-- بخش ۵: دفتر تلفن -->
        <div class="accordion-group single-btn">
            <button type="button" class="btn-trigger" onclick="navigateTo('phoneBook.html')">
                <span class="btn-title">
                    <span class="icon" aria-hidden="true">📒</span>
                    <span>دفتر تلفن دانشگاه</span>
                </span>
                <span class="link-arrow" aria-hidden="true">←</span>
            </button>
        </div>

        <!-- فوتر -->
        <footer class="app-footer">
            گردآوری و توسعه توسط <strong>کوشا آریاپور</strong>
        </footer>
    </main>

    <!-- مودال چارت -->
    <div id="chartModal" class="chart-modal" role="dialog" aria-modal="true" aria-labelledby="chartModalTitle" aria-hidden="true">
        <div class="chart-modal-bar">
            <button type="button" class="chart-back-btn" onclick="closeChart()">→ بازگشت</button>
            <span id="chartModalTitle" class="chart-modal-title">چارت دروس عمران</span>
            <span class="chart-modal-spacer" aria-hidden="true"></span>
        </div>
        <iframe id="chartFrame" class="chart-frame" src="" loading="lazy" title="چارت دروس عمران"></iframe>
    </div>

</body>
</html>
