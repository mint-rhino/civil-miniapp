<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منابع عمران فسا</title>
    
    <!-- SDK تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- فایل استایل جداگانه -->
    <link rel="stylesheet" href="style.css">

    <!-- استایل مودال چارت -->
    <style>
        .chart-modal { position: fixed; inset: 0; z-index: 9999; background: #1d2021; display: none; flex-direction: column; }
        .chart-modal.open { display: flex; }
        .chart-modal-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #282828; border-bottom: 1px solid rgba(235,219,178,.15); flex-shrink: 0; }
        .chart-modal-title { font-weight: 700; font-size: 14px; color: #ebdbb2; }
        .chart-back-btn { background: rgba(235,219,178,.08); border: 1px solid rgba(235,219,178,.22); color: #ebdbb2; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .chart-frame { flex: 1; width: 100%; border: 0; background: #1d2021; }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر -->
        <header>
            <div class="brand-title">
                <span>🏗️</span> منابع عمران فسا
            </div>
            <div class="brand-subtitle">پورتال دسترسی سریع به گروه‌ها و سامانه‌ها</div>
        </header>

        <!-- بخش ۱: منابع درسی -->
        <div class="accordion-group">
            <button class="btn-trigger" onclick="toggleAccordion(this, 'menu-study')">
                <div class="btn-title">
                    <span class="icon">📚</span>
                    <span>منابع درسی</span>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="menu-study" class="submenu-content">
                <div class="submenu-inner">
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/2')">
                        <span>🧑‍🔬  فیزیک / استاتیک / دینامیک</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/295')">
                        <span>📋 نظام مهندسی</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/498')">
                        <span>🏗️ مقاومت مصالح</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/93')">
                        <span>🛠️ دروس عملی و کارآموزی</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/3')">
                        <span>📐 ریاضی / آمار / دیفرانسیل</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/6')">
                        <span>📏 نقشه‌کشی / معماری / نقشه‌برداری</span>
                        <span class="link-arrow">←</span>
                    </button>
                    <button class="item-btn" onclick="openTopic('https://t.me/CivilFasa_resources/80')">
                        <span>🪨 زمین‌شناسی / مصالح / بتن</span>
                        <span class="link-arrow">←</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- بخش ۲: سامانه‌ها -->
        <div class="accordion-group">
            <button class="btn-trigger" onclick="toggleAccordion(this, 'menu-systems')">
                <div class="btn-title">
                    <span class="icon">🌐</span>
                    <span>سامانه‌های دانشگاه</span>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="menu-systems" class="submenu-content">
                <div class="submenu-inner">
                    <button class="item-btn" onclick="openExternal('https://food.fasau.ac.ir/')">
                        <span>🍽️ کالینان (سامانه غذا)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('https://pershiess.fasau.ac.ir/')">
                        <span>📖 اتوماسیون (آموزش)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('http://online.fasau.ac.ir/')">
                        <span>💻 مودل (امتحانات)</span>
                        <span class="link-arrow">↗</span>
                    </button>
                    <button class="item-btn" onclick="openExternal('https://ja-ostadi.ir/')">
                        <span>👨‍🏫 جا استادی</span>
                        <span class="link-arrow">↗</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- بخش ۳: نرم‌افزارها -->
        <div class="accordion-group single-btn">
            <button class="btn-trigger" onclick="openTopic('')">
                <div class="btn-title">
                    <span class="icon">💻</span>
                    <span>نرم‌افزارها</span>
                </div>
                <span class="link-arrow" style="color: var(--text-sub);">←</span>
            </button>
        </div>

        <!-- بخش ۴: چارت دروس -->
        <div class="accordion-group single-btn">
            <button class="btn-trigger" onclick="openChart()">
                <div class="btn-title">
                    <span class="icon">📊</span>
                    <span>چارت دروس عمران</span>
                </div>
                <span class="link-arrow" style="color: var(--text-sub);">←</span>
            </button>
        </div>
    </div>

    <!-- مودال چارت (داخل body، آخر صفحه) -->
    <div id="chartModal" class="chart-modal">
        <div class="chart-modal-bar">
            <button class="chart-back-btn" onclick="closeChart()">→ بازگشت</button>
            <span class="chart-modal-title">چارت دروس عمران</span>
            <span style="width:70px;"></span>
        </div>
        <iframe id="chartFrame" class="chart-frame" src="" title="چارت دروس عمران"></iframe>
    </div>

    <!-- فایل جاوااسکریپت جداگانه -->
    <script src="script.js"></script>
</body>
</html>
