<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منابع عمران فسا</title>
    <!-- اسکریپت رسمی Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 32px;
            font-size: 22px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .menu-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h2>📚 منابع عمران</h2>

    <!-- دکمه هدایت به تاپیک مشخص شده -->
    <button class="menu-btn" onclick="openTopic('https://t.me/CivilFasa_resources/2')">
        📖 ورود به تاپیک منابع
    </button>

    <script>
        // مقداردهی اولیه به Telegram WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); // باز کردن در حالت تمام صفحه

        // تابع پرش به تاپیک با استفاده از openTelegramLink
        function openTopic(url) {
            Telegram.WebApp.openTelegramLink(url);
        }
    </script>
</body>
</html>
